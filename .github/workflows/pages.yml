name: Build and publish curriculum
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: python -m pip install -r requirements-site.txt
      - run: python scripts/build_site.py --output _site --baseurl /Prep_GitHub_Ready
      - run: python scripts/check_built_site.py --directory _site
      - run: for file in app.js shell.js theme.js week.js reader.js storage.js; do node --check "$file"; done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
